name: CI

on:
  push:
    branches: [ zed, heet, main ]
  pull_request:
    branches: [ zed, heet, main ]

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck application
        run: npx tsc --noEmit

      - name: Typecheck tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production bundle (Webpack)
        run: npm run build -- --webpack

      - name: Check git diff
        run: git diff --check

